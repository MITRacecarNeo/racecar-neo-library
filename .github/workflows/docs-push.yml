name: Deploy to gh-pages on push
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Warnings fail the build, so a broken docstring never reaches the live site
      - run: "pip install sphinx -r requirements.txt && make html SPHINXOPTS=\"-W --keep-going\""
      - uses: peaceiris/actions-gh-pages@v4
        # Manual runs from other branches build the docs without replacing the live site
        if: github.ref == 'refs/heads/main'
        with:
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          publish_dir: './_build/html'
